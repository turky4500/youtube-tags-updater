name: List Channel Videos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المكتبات
        run: pip install google-auth google-api-python-client

      - name: سرد فيديوهات القناة
        env:
          TOKEN_PICKLE_B64: ${{ secrets.TOKEN_PICKLE_B64 }}
        run: python list_videos.py
