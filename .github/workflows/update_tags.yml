name: Update YouTube Tags (smart)

on:
  schedule:
    - cron: '0 2 * * 1'   # كل إثنين 02:00 UTC (أسبوعياً بدل يومي)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tags:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المكتبات
        run: pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: تشغيل سكربت التحديث
        env:
          CLIENT_SECRET_JSON_B64: ${{ secrets.CLIENT_SECRET_JSON_B64 }}
          TOKEN_PICKLE_B64: ${{ secrets.TOKEN_PICKLE_B64 }}
          # للتجربة بدون تغيير حقيقي، أزل التعليق عن السطر التالي:
          # DRY_RUN: "1"
          # لتفعيل إضافة الهاشتاقات إلى الوصف:
          # ADD_HASHTAGS: "1"
        run: python update_tags.py

      - name: حفظ السجلات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update_log.json change_log.json
          git diff --staged --quiet || git commit -m "تحديث السجلات"
          git push
